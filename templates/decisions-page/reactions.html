<title>Listen and Look</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Feedback page: each card = media (audio/img/text) + thumbs up/down + optional note, saved per item in db collection 'reactions'.
   Fill ITEMS below (or generate this file from a script; keep media small: the artifact limit is 16 MB, embed audio at ~64 kbps mono). */
:root{--bg:#0f1218;--slab:#171b24;--slab2:#1d2230;--line:#2a3140;--fg:#e8e1d3;--muted:#9aa3b4;--accent:#e0a23a;--ok:#6fd3a0;--no:#e07a3a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
h1{font:600 28px/1.1 system-ui;margin:0}.sub{color:var(--muted);margin:0;font-size:14px}
.c{background:var(--slab);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.c.si{border-color:var(--ok)}.c.no{border-color:var(--no)}
.c h3{margin:0;font:600 17px system-ui}audio{width:100%}img{max-width:100%;height:auto}
.btns{display:flex;gap:8px}
.b{flex:1;min-height:44px;border:1px solid var(--line);border-radius:4px;background:var(--slab2);color:var(--fg);font:600 15px system-ui;cursor:pointer}
.b[aria-pressed="true"].y{background:var(--ok);color:#0c1a12}.b[aria-pressed="true"].n{background:var(--no);color:#1a0d06}
.b:focus-visible,textarea:focus-visible,.sv:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{width:100%;min-height:44px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:10px;font:15px/1.4 system-ui}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sv{min-height:40px;padding:0 16px;border:0;border-radius:4px;background:var(--accent);color:#1a1208;font:600 14px system-ui;cursor:pointer}
.sv:disabled{opacity:.4}.st{font-size:13px;color:var(--muted)}.st.ok{color:var(--ok)}
</style>
<div class="wrap"><header><h1>Listen and look</h1><p class="sub">On each item: thumbs up or down, and a note if you want. Claude reads it from here.</p></header><div id="list"></div></div>
<script>
// item: {id, title, audio?: dataURI|url, img?: dataURI|url, text?: string}
const ITEMS=[{id:'example-1',title:'Example item',text:'Replace me.'}];
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
let db=null,R={};
function card(it){
  const cur=R[it.id]||{},st={vote:cur.vote||null,note:cur.note||''};
  const c=$('article','c'+(cur.vote?' '+cur.vote:''));c.append($('h3','',it.title));
  if(it.audio){const a=$('audio');a.controls=true;a.preload='none';a.src=it.audio;c.append(a);}
  if(it.img){const i=$('img');i.alt=it.title;i.src=it.img;c.append(i);}
  if(it.text)c.append($('p','',it.text));
  const y=$('button','b y','👍 Like'),n=$('button','b n','👎 No'),ta=$('textarea'),s=$('span','st'+(cur.vote?' ok':''),cur.vote?'Saved':''),sv=$('button','sv','Save');
  for(const b of [y,n,sv])b.type='button';sv.disabled=true;ta.placeholder='Optional note';ta.value=st.note;ta.setAttribute('aria-label','Note about '+it.title);
  const paint=()=>{y.setAttribute('aria-pressed',String(st.vote==='si'));n.setAttribute('aria-pressed',String(st.vote==='no'));};
  const save=async()=>{if(!db){s.textContent='Sign in to save';return;}sv.disabled=true;s.className='st';s.textContent='Saving…';
    try{await db.doc('reactions/'+it.id).set({vote:st.vote,note:st.note.trim(),at:new Date().toISOString()});s.className='st ok';s.textContent='Saved';c.className='c '+(st.vote||'');}catch(e){s.textContent='Could not save';sv.disabled=false;}};
  y.onclick=()=>{st.vote='si';paint();save();};n.onclick=()=>{st.vote='no';paint();save();};ta.oninput=()=>{st.note=ta.value;sv.disabled=false;};sv.onclick=save;
  paint();const bs=$('div','btns');bs.append(y,n);const r=$('div','row');r.append(s,sv);c.append(bs,ta,r);return c;
}
function render(){document.getElementById('list').replaceChildren(...ITEMS.map(card));}
(async()=>{render();db=await claude.use('db');if(!db)return;db.collection('reactions').onSnapshot(s=>{R={};for(const x of s.docs)R[x.id]=x.data();render();});})();
</script>
