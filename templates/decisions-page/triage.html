<title>Capability Triage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Capability triage: one row per capability + 3 buttons (now / later / no) + optional note. Saved per row in db collection 'triage'.
   Use it when the user must scope a big thing (engine, platform, v1): list every capability, let them mark it, then read 'triage' with ArtifactData. */
:root{--bg:#0f1218;--slab:#171b24;--slab2:#1d2230;--line:#2a3140;--fg:#e8e1d3;--muted:#9aa3b4;--accent:#e0a23a;--ok:#6fd3a0;--later:#e0a23a;--no:#9a6a6a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-width:0}
h1{font:600 26px/1.1 system-ui;margin:0}.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
h2{font:600 12px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 0}
.c{background:var(--slab);border:1px solid var(--line);border-left-width:4px;border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.c.now{border-left-color:var(--ok)}.c.later{border-left-color:var(--later)}.c.no{border-left-color:var(--no);opacity:.75}
.t{font-weight:600;overflow-wrap:anywhere}.d{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.tag{font-size:11px;color:var(--ok);border:1px solid currentColor;border-radius:3px;padding:1px 5px;margin-left:6px}
.bs{display:flex;gap:6px}
.b{flex:1;min-height:44px;border:1px solid var(--line);border-radius:4px;background:var(--slab2);color:var(--fg);font:600 14px system-ui;cursor:pointer}
.b:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.b[aria-pressed="true"][data-v="now"]{background:var(--ok);color:#0c1a12}.b[aria-pressed="true"][data-v="later"]{background:var(--later);color:#1a1208}.b[aria-pressed="true"][data-v="no"]{background:var(--no);color:#1a0d0d}
textarea{width:100%;min-height:40px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px;font:14px/1.4 system-ui}
.st{font-size:12px;color:var(--muted);min-height:16px}.st.ok{color:var(--ok)}
.sum{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
</style>
<div class="wrap"><header><h1>What should it do?</h1><p class="sub">Mark each capability: <b>Now</b>, <b>Later</b> or <b>No</b>. The note is optional and saves when you leave the field. "Done" = it already exists.</p></header><div class="sum" id="sum">—</div><div id="list"></div></div>
<script>
// [group, [[id, title, description, preselectedNow(0|1), done(0|1)?], ...]]
const CAPS=[["Core",[["loop","Fixed-step deterministic simulation","Same seed and inputs give the same run.",1],["scenes","Scenes and transitions","Title, menu, play, pause.",0]]]];
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
let db=null,R={};
function row(cap){
  const [id,title,desc,pre,done]=cap,cur=R[id]||{},st={v:cur.v||null,note:cur.note||''};
  const c=$('div','c'+(cur.v?' '+cur.v:'')),t=$('div','t',title);if(pre)t.append($('span','tag','suggested'));if(done)t.append($('span','tag','done'));
  const bs=$('div','bs'),s=$('div','st'),ta=$('textarea');ta.placeholder='Note';ta.value=st.note;ta.setAttribute('aria-label','Note on '+title);
  const save=async()=>{if(!db){s.textContent='Sign in to save';return;}s.className='st';s.textContent='Saving…';
    try{await db.doc('triage/'+id).set({v:st.v,note:st.note.trim(),at:new Date().toISOString()});s.className='st ok';s.textContent='Saved';c.className='c '+(st.v||'');sum();}catch(e){s.textContent='Could not save';}};
  for(const [v,l] of [['now','Now'],['later','Later'],['no','No']]){const b=$('button','b',l);b.type='button';b.dataset.v=v;b.setAttribute('aria-pressed',String(st.v===v));
    b.onclick=()=>{st.v=v;for(const x of bs.children)x.setAttribute('aria-pressed',String(x===b));save();};bs.append(b);}
  ta.onchange=()=>{st.note=ta.value;if(st.v)save();};
  c.append(t,$('div','d',desc),bs,ta,s);return c;
}
function sum(){const n={now:0,later:0,no:0};for(const k in R)if(n[R[k].v]!=null)n[R[k].v]++;document.getElementById('sum').textContent=`Now ${n.now} · Later ${n.later} · No ${n.no}`;}
function render(){const l=document.getElementById('list');l.replaceChildren();for(const [g,cs] of CAPS){l.append($('h2','',g));for(const c of cs)l.append(row(c));}sum();}
(async()=>{render();db=await claude.use('db');if(!db)return;db.collection('triage').onSnapshot(s=>{R={};for(const x of s.docs)R[x.id]=x.data();render();});})();
</script>
